name: biomni_e1
channels:
  - conda-forge
  - defaults
  - bioconda
dependencies:
  - python=3.11
  # Conda-managed core & scientific packages
  - numpy>=1.24.0
  - pandas>=2.0.0
  - matplotlib
  - scipy
  - statsmodels
  - scikit-learn
  - gradio
  - tqdm>=4.65.0
  - jsonschema>=4.17.0
  - chardet>=5.0.0
  - pyyaml>=6.0
  - loguru>=0.7.0
  - click>=8.1.0
  - biopython>=1.81
  - pip
  - pip:
      # LLM / Gemini / langchain
      - langchain
      - langchain_core>=0.1.0
      - langgraph==0.3.18
      - langchain_openai
      - langchain_anthropic
      - langchain_community
      - langchain-google-genai
      - langchain_ollama
      - openai>=1.0.0
      - google-generativeai>=0.5.0
      # Vector database
      - chromadb>=0.4.0
      # Database
      - sqlalchemy>=2.0.0
      - pymysql>=1.1.0
      - cryptography>=41.0.0
      # Utilities
      - beautifulsoup4
      - lxml
      - seaborn
      - networkx
      - requests
      - jupyter
      - notebook
      - ipykernel
      - pytest>=7.4.0
      - pytest-asyncio>=0.21.0
      - transformers
      - sentencepiece
      - python-dotenv
      - chembl-webresource-client
      - biomni
